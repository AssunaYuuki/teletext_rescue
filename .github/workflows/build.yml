# Teletext Rescue for Linux and macOS, built on GitHub's machines: the program with windows (SDL3 +
# Dear ImGui) and trcli. A version tag (v1.2, ...) also makes the release and attaches the archives;
# the Windows installer is built with build.bat and added to the release.
name: build

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['build/**']

permissions:
  contents: write

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: TeletextRescue-linux-x86_64
          - os: ubuntu-22.04-arm
            name: TeletextRescue-linux-arm64
          - os: macos-14
            name: TeletextRescue-macos-universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++ libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev \
            libxtst-dev libwayland-dev libxkbcommon-dev wayland-protocols libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev \
            libasound2-dev libpulse-dev libdbus-1-dev libudev-dev
      - name: Tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Build
        run: sh build.sh
      - name: Check
        run: |
          B=cpp/build-$(uname -s | tr 'A-Z' 'a-z')
          $B/trcli > usage.txt || true
          cat usage.txt
          grep -q "Teletext Rescue 1.2" usage.txt
          if [ "$(uname -s)" = "Darwin" ]; then lipo -info $B/trcli; lipo -info "$B/TeletextRescue.app/Contents/MacOS/TeletextRescue"; else file $B/trcli $B/TeletextRescue; fi
      - name: Package
        run: |
          B=cpp/build-$(uname -s | tr 'A-Z' 'a-z')
          N=${{ matrix.name }}
          mkdir -p pkg/$N
          cp $B/trcli README.md LICENSE pkg/$N/
          if [ "$(uname -s)" = "Darwin" ]; then
            cp -R "$B/TeletextRescue.app" "pkg/$N/Teletext Rescue.app"
          else
            cp $B/TeletextRescue pkg/$N/
            cp icon.png pkg/$N/ 2>/dev/null || true
          fi
          chmod +x pkg/$N/trcli
          tar -C pkg -czf $N.tar.gz $N
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: unix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Teletext Rescue ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: dist/*.tar.gz
