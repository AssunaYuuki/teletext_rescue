<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Страница __PID__</title>
<style>
body{margin:0;background:#000;color:#aaa;font:13px system-ui,sans-serif;padding:16px}
.wrap{max-width:760px;margin:auto}
canvas{width:100%;image-rendering:pixelated;background:#000;display:block;margin-bottom:6px}
.v{margin:14px 0 4px}
</style></head><body><div class="wrap" id="w"></div>
<script src="tt_render.js"></script>
<script>
const V=__DATA__, X=__EXTRA__;
const W=document.getElementById('w');
V.forEach((s,i)=>{
 if(V.length>1){const d=document.createElement('div');d.className='v';d.textContent=s.label||('Версия '+(i+1)+'/'+V.length);W.appendChild(d)}
 const cv=document.createElement('canvas');cv.width=480;cv.height=500;W.appendChild(cv);
 const rows={};for(const k in s.rows)rows[+k]=s.rows[k];
 TT.render(cv.getContext('2d'),rows,{reveal:false,over:s.x,cs:X.cs,cs2:X.cs2,flashOn:true});
});
</script></body></html>
